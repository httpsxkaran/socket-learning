<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no"
  />

  <title>Modern Chat App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      height:100dvh;

      overflow:hidden;

      background:
      linear-gradient(135deg,#0f172a,#1e293b);

      color:white;
    }

    .chat-container{

      width:100%;

      height:100dvh;

      display:flex;

      overflow:hidden;

      background:
      rgba(255,255,255,0.04);

      backdrop-filter:blur(10px);
    }

    /* ================= SIDEBAR ================= */

    .sidebar{

      width:280px;

      padding:25px;

      background:
      rgba(255,255,255,0.03);

      border-right:
      1px solid rgba(255,255,255,0.08);

      overflow-y:auto;
    }

    .sidebar h3{

      font-size:24px;

      margin-bottom:20px;

      color:#38bdf8;
    }

    #users{

      list-style:none;

      display:flex;

      flex-direction:column;

      gap:12px;
    }

    #users li{

      padding:14px;

      border-radius:14px;

      background:
      rgba(255,255,255,0.06);

      transition:0.3s;
    }

    #users li:hover{

      transform:translateX(5px);

      background:
      rgba(255,255,255,0.12);
    }

    /* ================= CHAT SECTION ================= */

    .chat-section{

      flex:1;

      display:flex;

      flex-direction:column;

      min-height:0;
    }

    .chat-header{

      padding:22px;

      font-size:24px;

      font-weight:bold;

      border-bottom:
      1px solid rgba(255,255,255,0.08);

      background:
      rgba(255,255,255,0.03);
    }

    /* ================= CHAT BOX ================= */

    #chat-box{

      flex:1;

      min-height:0;

      overflow-y:auto;

      padding:20px;

      display:flex;

      flex-direction:column;

      gap:14px;
    }

    #chat-box div{

      max-width:75%;

      padding:15px 18px;

      border-radius:18px;

      line-height:1.5;

      word-wrap:break-word;

      background:
      rgba(255,255,255,0.08);

      animation:fadeIn 0.25s ease;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* ================= FORM ================= */

    #message-form{

      display:flex;

      gap:12px;

      padding:16px;

      border-top:
      1px solid rgba(255,255,255,0.08);

      background:
      rgba(15,23,42,0.95);

      backdrop-filter:blur(10px);

      flex-shrink:0;
    }

    #message-input{

      flex:1;

      border:none;

      outline:none;

      padding:15px;

      border-radius:16px;

      font-size:16px;

      color:white;

      background:
      rgba(255,255,255,0.08);
    }

    #message-input::placeholder{
      color:#cbd5e1;
    }

    button{

      border:none;

      cursor:pointer;

      padding:15px 22px;

      border-radius:16px;

      font-size:16px;

      font-weight:bold;

      color:white;

      background:
      linear-gradient(135deg,#38bdf8,#6366f1);

      transition:0.3s;

      flex-shrink:0;
    }

    button:hover{

      transform:translateY(-2px);

      opacity:0.9;
    }

    /* ================= SCROLLBAR ================= */

    #chat-box::-webkit-scrollbar{
      width:8px;
    }

    #chat-box::-webkit-scrollbar-thumb{

      background:#475569;

      border-radius:10px;
    }

    /* ================= MOBILE ================= */

    @media(max-width:768px){

      .chat-container{

        flex-direction:column;
      }

      .sidebar{

        width:100%;

        max-height:120px;

        overflow-y:auto;

        border-right:none;

        border-bottom:
        1px solid rgba(255,255,255,0.08);

        padding:16px;
      }

      .sidebar h3{

        font-size:20px;

        margin-bottom:12px;
      }

      #users{

        flex-direction:row;

        overflow-x:auto;

        gap:10px;
      }

      #users li{

        min-width:100px;

        text-align:center;
      }

      .chat-header{

        font-size:20px;

        padding:16px;
      }

      #chat-box{

        padding:14px;
      }

      #chat-box div{
        max-width:90%;
      }

      #message-form{

        padding:12px;
      }

      #message-input{

        padding:14px;

        font-size:16px;
      }

      button{

        padding:14px 18px;
      }
    }

  </style>

</head>

<body>

  <div class="chat-container">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

      <h3>Online Users</h3>

      <ul id="users"></ul>

    </div>

    <!-- ================= CHAT SECTION ================= -->

    <div class="chat-section">

      <div class="chat-header">
        Real Time Chat
      </div>

      <div id="chat-box"></div>

      <!-- ================= MESSAGE FORM ================= -->

      <form id="message-form">

        <input
          id="message-input"
          type="text"
          placeholder="Enter your message..."
          required
        >

        <button type="submit">
          Send
        </button>

      </form>

    </div>

  </div>

  <!-- ================= SOCKET.IO ================= -->

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    const chat =
    document.getElementById('chat-box');

    const messageForm =
    document.getElementById('message-form');

    const userList =
    document.getElementById('users');

    const messageInput =
    document.getElementById('message-input');

    const username =
    prompt('Enter your username');

    socket.emit('join', username);

    /* ================= USER JOINED ================= */

    socket.on('userJoined', (users)=>{

      addMessage(`${users} has joined the chat`);

    });

    /* ================= USER LEFT ================= */

    socket.on('userLeft', (user)=>{

      addMessage(`${user} has left the chat`);

    });

    /* ================= SEND MESSAGE ================= */

    messageForm.addEventListener('submit', (event)=>{

      event.preventDefault();

      const messageInfo =
      messageInput.value.trim();

      if(messageInfo){

        socket.emit('userChat', {

          username,

          text : messageInfo
        });

      }

      messageInput.value = '';

    });

    /* ================= ADD MESSAGE ================= */

    function addMessage(input){

      const message =
      document.createElement('div');

      message.textContent = input;

      chat.appendChild(message);

      chat.scrollTop =
      chat.scrollHeight;
    }

    /* ================= USER LIST ================= */

    socket.on('userList',(users)=>{

      userList.innerHTML =
      users.map((user)=>
      `<li>${user}</li>`).join("");

    });

    /* ================= RECEIVE MESSAGE ================= */

    socket.on('userChat', (message)=>{

      addMessage(`${message.username}: ${message.text}`);

    });

  </script>

</body>

</html>
